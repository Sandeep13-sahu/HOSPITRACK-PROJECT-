services:
  # -------------------------------------------------------------
  # Backend Spring Boot 3 Web Service
  # -------------------------------------------------------------
  - type: web
    name: hospitrack-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: hospitrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 3600000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: no-reply@hospitrack.com
      - key: BREVO_SENDER_NAME
        value: Hospitrack Production
      - key: INITIAL_ADMIN_EMAIL
        value: admin@hospitrack.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: hospitrack-frontend
    env: static
    buildCommand: echo "Static build ready"
    staticPublishPath: .
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: hospitrack-db
    databaseName: hospitrack_prod
    user: hospitrack_user
    plan: free
    region: oregon
